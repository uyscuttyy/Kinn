[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
# Values resolve from the environment (see BASE_INTEGRATION.md).
base_sepolia = "${KINN_BASE_SEPOLIA_RPC_URL}"
base = "${KINN_BASE_RPC_URL}"

[invariant]
runs = 32
depth = 128
